<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive JavaScript Demo</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>JavaScript Interactive Demo</h1>
    </header>

    <main>
        <section class="demo-section">
            <h2>Text Content Change</h2>
            <p id="dynamic-text">Click the button to change this text!</p>
            <button id="change-text-btn">Change Text</button>
        </section>

        <section class="demo-section">
            <h2>Style Modification</h2>
            <div id="style-target">This element's style will change</div>
            <button id="change-style-btn">Toggle Styles</button>
        </section>

        <section class="demo-section">
            <h2>Element Management</h2>
            <div id="element-container">
                <p id="toggle-element">This element can be removed/added</p>
            </div>
            <div class="button-group">
                <button id="remove-element-btn">Remove Element</button>
                <button id="add-element-btn">Add Element</button>
            </div>
        </section>
    </main>

    <footer>
        <p>JavaScript DOM Manipulation Demo</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
